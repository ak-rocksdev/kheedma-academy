# Kheedma Academy — Nginx site
# Target: /etc/nginx/sites-available/kheedma.hyperscore.cloud.conf
#         symlinked into /etc/nginx/sites-enabled/
#
# This is the HTTP (port 80) form. Run Certbot afterwards to add the TLS server
# block and the 80->443 redirect automatically:
#   sudo certbot --nginx -d kheedma.hyperscore.cloud
#
# Uses $realpath_root so PHP-FPM/OPcache always resolves the real release path
# behind the `current` symlink (avoids stale opcache after a deploy).

server {
    listen 80;
    server_name kheedma.hyperscore.cloud;

    root /srv/www/kheedma-academy/current/public;
    index index.php index.html;

    access_log /var/log/nginx/kheedma.access.log;
    error_log  /var/log/nginx/kheedma.error.log;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    # Cache built assets aggressively (hashed filenames from Vite)
    location ^~ /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Deny dotfiles, but allow ACME challenge for Certbot
    location ~ /\.(?!well-known) {
        deny all;
    }
}
